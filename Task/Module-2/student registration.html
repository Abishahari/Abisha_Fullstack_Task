<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .gender {
            display: flex;
            gap: 20px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-btn {
            background: #4f46e5;
            color: white;
        }

        .register-btn:hover {
            background: #3730a3;
        }

        .reset-btn {
            background: #e5e7eb;
            color: #333;
        }

        .reset-btn:hover {
            background: #d1d5db;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Register your student details
        </p>

        <form id="studentForm">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-row">

                <!-- Roll Number -->
                <div class="form-group">

                    <label for="rollNo">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="rollNo"
                        placeholder="Enter roll number"
                        required
                    >

                </div>


                <!-- Date of Birth -->
                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>

            </div>


            <!-- Gender -->
            <div class="form-group">

                <label>
                    Gender
                </label>

                <div class="gender">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

            </div>


            <div class="form-row">

                <!-- Department -->
                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            Computer Science Engineering
                        </option>

                        <option value="IT">
                            Information Technology
                        </option>

                        <option value="ECE">
                            Electronics and Communication
                        </option>

                        <option value="EEE">
                            Electrical and Electronics
                        </option>

                        <option value="MECH">
                            Mechanical Engineering
                        </option>

                        <option value="CIVIL">
                            Civil Engineering
                        </option>

                    </select>

                </div>


                <!-- Year -->
                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select id="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1">
                            1st Year
                        </option>

                        <option value="2">
                            2nd Year
                        </option>

                        <option value="3">
                            3rd Year
                        </option>

                        <option value="4">
                            4th Year
                        </option>

                    </select>

                </div>

            </div>


            <!-- Address -->
            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                    required
                ></textarea>

            </div>


            <!-- Password -->
            <div class="form-row">

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        minlength="6"
                        required
                    >

                </div>

            </div>


            <!-- Terms -->
            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I agree to the terms and conditions.

                </label>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button
                    type="submit"
                    class="register-btn">

                    Register

                </button>

                <button
                    type="reset"
                    class="reset-btn">

                    Clear

                </button>

            </div>


            <p id="message"></p>

        </form>

    </div>


    <script>

        // ES6 Event Management

        const form =
            document.querySelector("#studentForm");

        const message =
            document.querySelector("#message");


        form.addEventListener("submit", event => {

            event.preventDefault();


            const password =
                document.querySelector("#password").value;

            const confirmPassword =
                document.querySelector("#confirmPassword").value;


            // Password validation

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match!";

                message.style.color = "red";

                return;
            }


            // Get gender

            const gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                ).value;


            // Student object using ES6

            const student = {

                name:
                    document.querySelector("#name").value,

                rollNo:
                    document.querySelector("#rollNo").value,

                dob:
                    document.querySelector("#dob").value,

                email:
                    document.querySelector("#email").value,

                phone:
                    document.querySelector("#phone").value,

                gender,

                department:
                    document.querySelector("#department").value,

                year:
                    document.querySelector("#year").value,

                address:
                    document.querySelector("#address").value

            };


            console.log(student);


            message.textContent =
                `Registration successful! Welcome ${student.name}.`;

            message.style.color = "green";


            // Clear form

            form.reset();

        });

    </script>

</body>

</html>
